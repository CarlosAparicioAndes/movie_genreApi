services:
  - type: web
    name: movie-genre-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120 --preload api:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
